version: "3.9"

services:
  api:
    image: techpetani-api
    build:
      context: ../..
      dockerfile: Docker/prod/Dockerfile
    env_file:
      - ../../.env
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    restart: unless-stopped
    networks:
      - techpetani_network

networks:
  techpetani_network:
    driver: bridge
