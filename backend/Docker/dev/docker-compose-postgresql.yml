version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: techpetani_db
    restart: always
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "dbName"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - techpetani_network

networks:
  techpetani_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
