version: "3.9"

services:
  api:
    build:
      context: ../..
      dockerfile: Docker/dev/Dockerfile
    env_file:
      - ../../.env
    container_name: techpetani-api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    networks:
      - techpetani_network

networks:
  techpetani_network:
    driver: bridge
